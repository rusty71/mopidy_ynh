#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mopidy"
name = "Mopidy"
description.en = "Music server with the Iris web interface, Qobuz hi-res streaming and an Icecast publisher"
description.fr = "Serveur de musique avec l'interface web Iris, le streaming Qobuz hi-res et un filtreur Icecast"

version = "3.4.2~ynh28"

maintainers = ["rusty71"]

[upstream]
license = "Apache-2.0"
website = "https://www.mopidy.com"
admindoc = "https://docs.mopidy.com/en/latest"
code = "https://github.com/mopidy/mopidy"

[integration]
yunohost = ">= 11.2.30"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = false
sso = false
disk = "1500M"
ram.build = "500M"
ram.runtime = "200M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/mopidy"

    [install.init_main_permission]
    help.en = "The web interface (Iris) can be used by anonymous visitors."
    help.fr = "L'interface web (Iris) peut etre utilisee par des visiteurs anonymes."
    type = "group"
    default = "visitors"

    [install.qobuz_email]
    ask.en = "Qobuz account e-mail"
    help.en = "Only used as a fallback: since April 2026 Qobuz blocks programmatic e-mail/password logins, so an auth token is the way in."
    type = "email"
    optional = true

    [install.qobuz_auth_token]
    ask.en = "Qobuz auth token"
    help.en = "The token that the Qobuz web player holds. Leave empty to fill it in later from the config panel."
    type = "password"
    optional = true

    [install.qobuz_app_id]
    ask.en = "Qobuz app id"
    type = "string"
    default = "377257687"

    [install.qobuz_secret]
    ask.en = "Qobuz app secret"
    help.en = "Has to be the secret that belongs to the app id (the auth token is bound to the app id as well). The integration pair is 806331c3b0b641da923b890aed01d04a for the app id 377257687."
    type = "password"

    [install.qobuz_quality]
    ask.en = "Streaming and download quality"
    type = "select"
    choices.27 = "Hi-res FLAC, up to 24-bit/192 kHz"
    choices.7 = "Hi-res FLAC, up to 24-bit/96 kHz"
    choices.6 = "CD quality FLAC, 16-bit/44.1 kHz"
    choices.5 = "MP3, 320 kbps"
    default = "27"

    [install.icecast_host]
    ask.en = "Icecast host"
    type = "string"
    default = "127.0.0.1"

    [install.icecast_port]
    ask.en = "Icecast port"
    help.en = "The port of the Icecast app: it has to be the same one."
    type = "number"
    default = 8000

    [install.icecast_password]
    ask.en = "Icecast password"
    help.en = "The password of the Icecast app: the source password and the admin password are the same there."
    type = "password"

    [install.icecast_admin_user]
    ask.en = "Icecast admin user"
    type = "string"
    default = "admin"

    [install.streams_url]
    ask.en = "Address of the streams"
    help.en = "The link on the page of the interface points to the playlists of the streams. Leave it empty to use the Icecast app of this server."
    type = "string"
    optional = true
    default = ""

    [install.hide_volume]
    ask.en = "Hide the volume control in the web interface?"
    help.en = "The volume belongs to the server, so two listeners would fight over it."
    type = "boolean"
    default = true

    [install.cache_enabled]
    ask.en = "Download queued albums to the local library?"
    help.en = "When an album is queued, it is downloaded in the background as tagged FLAC files and added to the local library."
    type = "boolean"
    default = true

    [install.cache_dir]
    ask.en = "Directory for the cached albums"
    type = "string"
    default = "/home/yunohost.multimedia/share/Music/Qobuz"

[resources]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["data", "cache"]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 6680

    [resources.apt]
    packages = [
        "acl",
        "build-essential",
        "debconf",
        "ffmpeg",
        "gir1.2-gst-plugins-base-1.0",
        "gir1.2-gstreamer-1.0",
        "git",
        "gstreamer1.0-plugins-base",
        "gstreamer1.0-plugins-good",
        "gstreamer1.0-plugins-ugly",
        "gstreamer1.0-tools",
        "libcairo2-dev",
        "libgirepository1.0-dev",
        "pkg-config",
        "python3-dev",
        "python3-gi",
        "python3-gst-1.0",
        "python3-pip",
        "python3-venv",
    ]
