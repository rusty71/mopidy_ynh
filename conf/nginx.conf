# The address of the streams, for the link on the page of the interface.
set $streams_url "__STREAMS_URL__";

# The Iris web interface talks to Mopidy over the JSON-RPC websocket.  The
# frontend builds that URL from the browser location and always uses the
# path /mopidy/ws, so this location has to be at the root of the domain,
# whatever path the app is installed under.
location /mopidy/ws {

    proxy_pass http://127.0.0.1:__PORT__/mopidy/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The websocket stays open as long as the browser tab is open.
    proxy_read_timeout 604800;
    proxy_send_timeout 604800;
}

# The Iris frontend opens a websocket of its own too, for the browsing
# activity.  It needs its own location: the generic one below does not
# forward the headers of a websocket upgrade, and the connection would be
# refused.
location __PATH__/iris/ws {

    proxy_pass http://127.0.0.1:__PORT__/iris/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 604800;
    proxy_send_timeout 604800;
}

# The album art of the local library.  Mopidy-Local serves the images under
# the path /local/, which is outside of the app, so the browser would ask
# the domain for them and end up at the login page of YunoHost.
location /local/ {

    proxy_pass http://127.0.0.1:__PORT__/local/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}

# The bare URL of the app opens the web interface.  Mopidy itself would
# redirect to /iris/, but that path is absolute and would not survive the
# reverse proxy, so the redirect is done here.
location = __PATH__/ {
    return 302 __PATH__/iris/;
}

# The same for the old bookmarks of the interface.
location = __PATH__/index.html {
    return 302 __PATH__/iris/;
}

location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mopidy answers the page of the interface compressed, and a compressed
    # page cannot be changed, so it is asked for it uncompressed.
    proxy_set_header Accept-Encoding "";

    # A link to the playlists of the streams is put on top of the page of the
    # interface, so the stream can be opened in a music player.
    sub_filter_once off;
    sub_filter '<div id="app">' '<style>body{padding-top:30px;box-sizing:border-box}#ynh-streams{position:fixed;top:0;left:0;right:0;z-index:1000;background:#111;color:#ccc;padding:.45rem 1rem;font:13px/1.4 system-ui,-apple-system,sans-serif}#ynh-streams a{color:#7fd1ff;text-decoration:none}@media(prefers-color-scheme:light){#ynh-streams{background:#eee;color:#333}#ynh-streams a{color:#0a58ca}}</style><div id="ynh-streams">listen to your radio here: <a href="$streams_url/low.m3u">MP3, 320 kbps</a></div><div id="app">';

    # Keep the path of the app in the redirects of Mopidy.
    proxy_redirect ~^(/.*)$ __PATH__$1;

    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}
