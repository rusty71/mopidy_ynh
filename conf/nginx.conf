# The Iris web interface talks to Mopidy over the JSON-RPC websocket.  The
# frontend builds that URL from the browser location and always uses the
# path /mopidy/ws, so this location has to be at the root of the domain,
# whatever path the app is installed under.
location /mopidy/ws {

    proxy_pass http://127.0.0.1:__PORT__/mopidy/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # The websocket stays open as long as the browser tab is open.
    proxy_read_timeout 604800;
    proxy_send_timeout 604800;
}

# The Iris frontend opens a websocket of its own too, for the browsing
# activity.  It needs its own location: the generic one below does not
# forward the headers of a websocket upgrade, and the connection would be
# refused.
location __PATH__/iris/ws {

    proxy_pass http://127.0.0.1:__PORT__/iris/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 604800;
    proxy_send_timeout 604800;
}

# The bare URL of the app opens the web interface.  Mopidy itself would
# redirect to /iris/, but that path is absolute and would not survive the
# reverse proxy, so the redirect is done here.
location = __PATH__/ {
    return 302 __PATH__/iris/;
}

location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mopidy answers a request without a trailing slash with a redirect to
    # the path it knows ("/iris/"), which is outside of the app and ends up
    # at the 404 page of the domain.  The redirect gets the path of the app
    # in front of it again.
    proxy_redirect ~^(/.*)$ __PATH__$1;

    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}
