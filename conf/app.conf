# Mopidy configuration for the Mopidy + Qobuz stack (YunoHost package).
#
# For further information about options in this file see:
#   http://docs.mopidy.com/
#
# This file is generated by the package: it contains the Qobuz credentials and
# the Icecast password, so it is only readable by the Mopidy user.

[core]
cache_dir = __DATA_DIR__/cache
config_dir = __DATA_DIR__/config
data_dir = __DATA_DIR__/data
max_tracklist_length = 10000
restore_state = true

[logging]
verbosity = 2
format = %(levelname)-8s:  %(message)s
color = true

[audio]
# Software mixing so that the volume changes work on the Icecast stream.
mixer = software
mixer_volume = 100
# Mopidy publishes the stream itself, through GStreamer's shout2send.  A
# single 320 kbps MP3 at 44.1 kHz, which is exactly what Qobuz delivers as
# CD quality.  There is no separate encoder or publisher process.
#
# The app connects to the plain socket of Icecast on the loopback interface:
# shout2send cannot speak TLS, and the public socket is the one with the
# certificate.  The password must match <source-password> in icecast.xml.
output = audioresample ! audioconvert ! audio/x-raw,rate=44100,channels=2,format=S16LE ! lamemp3enc target=bitrate bitrate=320 cbr=true ! shout2send ip=__ICECAST_HOST__ port=__ICECAST_SOURCE_PORT__ mount=/low.mp3 username=source password="__ICECAST_PASSWORD__" streamname="Mopidy"

[http]
# The web interface (Iris) is served here.  Set to 0.0.0.0 to allow direct
# access, the nginx reverse proxy of YunoHost is used otherwise.
hostname = 127.0.0.1
port = __PORT__
default_app = iris
allowed_origins =
    http://localhost:__PORT__
    http://127.0.0.1:__PORT__

[local]
# Mopidy-Local: an indexed local music library (SQLite), with album, artist
# and genre browsing.  Build or update the index with:
#
#     mopidy local scan
#
media_dir = __MEDIA_DIR__
scan_timeout = 3000
scan_follow_symlinks = false
max_search_results = 100

[file]
# Disabled on purpose: Mopidy-Local indexes the same directory, and the
# built-in extension would show every file a second time.
enabled = false

[softwaremixer]
enabled = true

[icecast_titles]
# The frontend publishes the title of the playing track to Icecast.  It
# does not use the tags of the stream, because Qobuz serves tagless FLAC;
# the admin endpoint is on the plain socket of Icecast.
enabled = true
url = http://__ICECAST_HOST__:__ICECAST_SOURCE_PORT__/admin/metadata
mount = /low.mp3
username = __ICECAST_ADMIN_USER__
password = __ICECAST_PASSWORD__

[qobuz]
enabled = true
username = __QOBUZ_EMAIL__
password =
auth_token = __QOBUZ_AUTH_TOKEN__
app_id = __QOBUZ_APP_ID__
secret = __QOBUZ_SECRET__
quality = __QOBUZ_QUALITY__
# Download queued albums as tagged FLAC files, so they show up in the local
# library.  The files are stored as
# <cache_dir>/<artist>/<album>/<track number> - <track title>.flac
cache_enabled = __CACHE_ENABLED__
cache_dir = __CACHE_DIR__
search_album_count = 10
search_track_count = 10
search_artist_count = 0
custom_libraries =
